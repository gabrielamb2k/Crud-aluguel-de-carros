<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Estilização geral */
        body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        }

        /* Container do formulário */
        .container {
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
        }

        /* Título */
        h2 {
        margin-bottom: 20px;
        color: #333;
        }

        /* Campos do formulário */
        label {
        display: block;
        margin: 10px 0 5px;
        font-weight: bold;
        color: #555;
        }

        input {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        }

        /* Botão de envio */
        button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #007BFF;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        }

        button:hover {
        background-color: #0056b3;
        }

        /* Mensagem de sucesso */
        .mensagem {
        background: #d4edda;
        color: #155724;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 15px;
        }

        /* Botão de voltar */
        .btn-voltar {
        display: inline-block;
        margin-top: 15px;
        text-decoration: none;
        color: #007BFF;
        font-weight: bold;
        }

        .btn-voltar:hover {
        text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Cadastro de Usuário</h2>

    <!-- Mensagem de sucesso -->
    <div th:if="${mensagem}" class="mensagem" th:text="${mensagem}"></div>

    <form th:action="@{/usuarios/cadastrar}" th:object="${usuario}" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}" placeholder="Digite seu nome" required />

        <label for="email">E-mail:</label>
        <input type="email" id="email" th:field="*{email}" placeholder="Digite seu e-mail" required />

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}" placeholder="Digite seu CPF" required />

    </form>

    <!-- Botão para ver carros disponíveis -->
    <a class="btn-ver-carros" th:href="@{/carros/ui/listar}">Cadastrar</a>
</div>
</body>
</html>
