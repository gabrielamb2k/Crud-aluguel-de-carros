<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Alugar Veículo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Reset geral */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        /* Container principal */
        .container {
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Título */
        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        /* Formulário */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            text-align: left;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Botão de confirmação */
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Mensagem de sucesso */
        .mensagem {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .sucesso {
            background-color: #28a745;
            color: white;
        }

        /* Botão de voltar */
        .btn-voltar {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn-voltar:hover {
            background-color: #c82333;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                width: 95%;
            }
        }

    </style>
</head>
<body>
<div class="container">
    <h2>Alugar Veículo</h2>

    <!-- Exibir mensagem de sucesso -->
    <div th:if="${mensagem}" class="mensagem sucesso" th:text="${mensagem}"></div>

    <<form th:action="@{/aluguel/ui/alugar/{carroId}(carroId=${carroSelecionado.id})}" th:object="${aluguel}" method="post">

        <label for="carro">Carro:</label>
        <input type="text" id="carro" th:value="${carroSelecionado.nome}" disabled />
        <input type="hidden" th:field="*{carros}" />

        <label for="dataInicio">Data de Início:</label>
        <input type="date" id="dataInicio" th:field="*{dataInicio}" required />

        <label for="dataFim">Data de Fim:</label>
        <input type="date" id="dataFim" th:field="*{dataFim}" required />

        <button type="submit">Confirmar Aluguel</button>
    </form>

    <a class="btn-voltar" th:href="@{/carros/ui/listar}">Voltar para Lista de Carros</a>
</div>
</body>
</html>
